services:
  client:
    restart: unless-stopped
    container_name: doc-frontend
    image: softvence/doc-client:latest
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
      # ADD THIS SECTION: Pass variables as build arguments
      args:
        - NODE_ENV=production
        - NEXT_TELEMETRY_DISABLED=1
        - NEXT_PUBLIC_API_BASE_URL=https://prod.weightlossmdcherrycreek.com

    # Keep environment for runtime (in case the app reads them again at runtime)
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_API_BASE_URL=https://prod.weightlossmdcherrycreek.com
      - API_BASE_URL=https://prod.weightlossmdcherrycreek.com/api/v1 # Change 'server' and '5000' to your backend service name and port if needed

    ports:
      - "3000:3000"